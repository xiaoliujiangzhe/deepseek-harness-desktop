<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方向 A · Signal White</title>
  <!-- Assumption: official, quiet, and precise; XLJZ is a restrained signature. -->
  <style>
    :root { --blue:#4d6bfe; --ink:#11131a; --muted:#697083; --line:#dfe4ee; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { display:grid; place-items:center; background:#d9dde6; font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif; }
    .stage { width:480px; height:340px; position:relative; overflow:hidden; background:#fff; color:var(--ink); border-radius:14px; box-shadow:0 22px 55px rgba(22,31,55,.22); }
    .topline { height:5px; background:var(--blue); }
    .content { height:335px; padding:30px 34px 24px; display:grid; grid-template-rows:auto 1fr auto; }
    .brand { display:flex; align-items:center; gap:15px; }
    .brand img { width:52px; height:52px; display:block; }
    .brand h1 { margin:0; font-size:21px; font-weight:660; letter-spacing:0; line-height:1.15; }
    .brand p { margin:5px 0 0; color:var(--muted); font:600 11px/1 "Cascadia Mono",Consolas,monospace; letter-spacing:.11em; text-transform:uppercase; }
    .main { align-self:center; }
    .eyebrow { color:var(--blue); font:600 12px/1.2 "Cascadia Mono",Consolas,monospace; }
    .status { margin-top:11px; font-size:16px; font-weight:550; }
    .progress { margin-top:19px; height:2px; background:#e8ebf2; position:relative; }
    .progress::before { content:""; position:absolute; inset:0 auto 0 0; width:64%; background:var(--blue); }
    .progress::after { content:""; position:absolute; left:calc(64% - 4px); top:-3px; width:8px; height:8px; border-radius:50%; background:#fff; border:2px solid var(--blue); }
    .meta { margin-top:10px; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    .meta strong { color:var(--ink); font:650 12px/1 "Cascadia Mono",Consolas,monospace; }
    footer { display:flex; align-items:end; justify-content:space-between; border-top:1px solid var(--line); padding-top:14px; }
    .unofficial { color:#777f90; font-size:11px; }
    .signature { color:var(--blue); font:700 22px/1 "Segoe Script","Segoe UI",cursive; transform:rotate(-5deg); }
  </style>
</head>
<body>
  <main class="stage">
    <div class="topline"></div>
    <div class="content">
      <header class="brand">
        <img src="../vendor/deepseek-harness/website/public/favicon.svg" alt="DeepSeek 鲸鱼标识">
        <div><h1>DeepSeek Harness</h1><p>Desktop</p></div>
      </header>
      <section class="main">
        <div class="eyebrow">LOCAL SERVICE / CONNECTING</div>
        <div class="status">正在启动本地服务</div>
        <div class="progress"></div>
        <div class="meta"><span>正在确认 HTTP 可访问</span><strong>64%</strong></div>
      </section>
      <footer><span class="unofficial">Unofficial community desktop</span><span class="signature">XLJZ</span></footer>
    </div>
  </main>
</body>
</html>
