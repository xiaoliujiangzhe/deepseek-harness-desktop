<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向 B · 工作区标签</title>
  <style>
    :root{--blue:#4d6bfe;--ink:#16191f;--muted:#717989;--line:#dfe3e9;--bar:#eef0f4;--paper:#fff;--dark:#252932}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;background:#cfd4dd;color:var(--ink)}button,input{font:inherit;letter-spacing:0}.window{width:100vw;height:100vh;background:var(--paper);display:grid;grid-template-rows:46px 46px 1fr}.titlebar{display:flex;align-items:center;padding:0 16px;background:#f7f8fa;border-bottom:1px solid var(--line)}.titlebar img{width:26px;height:26px;margin-right:9px}.titlebar strong{font-size:14px}.titlebar span{margin-left:auto;color:var(--muted);font:11px Consolas,monospace}.tabs{display:flex;align-items:end;padding:0 14px;background:var(--bar);border-bottom:1px solid #cfd4dc;gap:3px}.tab{height:38px;min-width:144px;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;background:transparent;padding:0 14px;text-align:left;color:#555d6d;cursor:pointer}.tab b{font-weight:600}.tab small{float:right;color:#969daa}.tab.active{background:#fff;border-color:#cfd4dc;color:var(--ink)}.plus{width:38px;min-width:38px;text-align:center;font-size:20px}.workspace{min-height:0;display:grid;grid-template-columns:72px 1fr}.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:9px}.rail button{width:48px;height:48px;border:0;border-radius:5px;background:transparent;color:#596172;font-size:11px;cursor:pointer}.rail button.active{background:#edf0ff;color:var(--blue);font-weight:700}.rail .bottom{margin-top:auto}.panel{min-width:0;min-height:0;display:grid;grid-template-rows:70px 1fr}.panel-head{display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line)}.panel-head h1{font-size:22px;margin:0}.panel-head .sub{margin-left:13px;color:var(--muted);font-size:13px}.seg{margin-left:auto;border:1px solid #d6dae2;border-radius:5px;padding:3px;display:flex}.seg button{height:30px;border:0;border-radius:3px;background:transparent;padding:0 13px;color:#687083}.seg .active{background:var(--dark);color:#fff}.content{min-height:0;display:grid;grid-template-columns:280px 1fr}.filter{background:#fafbfc;border-right:1px solid var(--line);padding:22px}.filter label{display:block;color:#7a8292;font-size:12px;font-weight:700;margin:0 0 8px}.search{height:40px;width:100%;border:1px solid #d6dae2;border-radius:4px;padding:0 11px}.filter h2{font-size:12px;margin:26px 0 8px;color:#7a8292;text-transform:uppercase}.filter button{height:38px;width:100%;border:0;border-radius:4px;background:transparent;text-align:left;padding:0 10px;color:#555d6d}.filter button.active{background:#edf0ff;color:var(--blue);font-weight:700}.runtime{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}.runtime div{display:flex;justify-content:space-between;padding:6px 0;color:#687083;font-size:12px}.runtime code{color:#313744}.market{padding:30px 38px;min-width:0}.source{height:44px;border:1px solid #d9dde5;background:#fafbfc;display:flex;align-items:center;padding:0 14px;color:#525a6a;font-size:13px}.source code{margin-left:8px}.source button{margin-left:auto;border:0;background:transparent;color:var(--blue);font-weight:650}.empty{height:calc(100% - 44px);display:grid;place-items:center}.empty-box{width:520px;text-align:center}.index-mark{width:70px;height:70px;margin:0 auto 22px;border:1px solid #bcc3d0;display:grid;place-items:center;font:700 18px Consolas,monospace;color:var(--blue);background-image:linear-gradient(#e4e7ed 1px,transparent 1px),linear-gradient(90deg,#e4e7ed 1px,transparent 1px);background-size:12px 12px}.empty h3{font-size:18px;margin:0 0 9px}.empty p{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.load{height:40px;margin-top:20px;border:0;border-radius:4px;background:var(--blue);color:#fff;padding:0 18px;font-weight:650}.notice{margin-top:28px;padding:13px 16px;border-top:1px solid #dfe3e9;border-bottom:1px solid #dfe3e9;color:#596172;font-size:12px;line-height:1.6;text-align:left}.view{display:none}.view.active{display:grid}.browser-view{grid-template-rows:48px 1fr}.chrome{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}.chrome button{height:34px;min-width:34px;border:1px solid var(--line);background:#fff;border-radius:4px}.chrome input{height:34px;border:1px solid var(--line);border-radius:4px;padding:0 11px}.browser-page{display:grid;place-items:center;color:#6b7383;background:#f8f9fb}.browser-page strong{display:block;color:#2c313b;font-size:22px;margin-bottom:8px}
  </style>
</head>
<body><main class="window"><header class="titlebar"><img src="../assets/whale.svg" alt=""><strong>DeepSeek Harness</strong><span>DESKTOP · XLJZ / BUILD</span></header><nav class="tabs"><button class="tab"><b>对话</b><small>×</small></button><button class="tab"><b>Vision 文档</b><small>×</small></button><button class="tab active" data-view="plugins"><b>插件中心</b><small>×</small></button><button class="tab plus" title="新建工作区">+</button></nav><section class="workspace"><aside class="rail"><button>新建</button><button>任务</button><button class="active">工具</button><button class="bottom">设置</button></aside><div class="panel view active" id="plugins"><header class="panel-head"><h1>插件中心</h1><span class="sub">面向 web profile</span><div class="seg"><button class="active">仓库</button><button>已安装 0</button></div></header><div class="content"><aside class="filter"><label for="plugin-search">搜索仓库</label><input class="search" id="plugin-search" placeholder="名称、作者或用途"><h2>来源</h2><button class="active">GitHub dsh-plugin</button><button>本地安装记录</button><h2>兼容性</h2><button>兼容</button><button>待核实</button><div class="runtime"><div><span>Harness</span><code>0.1.1-rc.2</code></div><div><span>Profile</span><code>web</code></div><div><span>第三方插件</span><code>0</code></div></div></aside><section class="market"><div class="source">索引来源 <code>github.com/topics/dsh-plugin</code><button>在 GitHub 查看</button></div><div class="empty"><div class="empty-box"><div class="index-mark">DSH</div><h3>准备加载插件仓库</h3><p>索引只保留具备 DSH bundle 声明的项目。<br>版本范围无法核实时，不会替你猜测兼容结果。</p><button class="load">加载仓库索引</button><div class="notice">第三方安装脚本默认关闭。安装完成后，桌面端会要求重启并检查插件是否进入 active 状态。</div></div></div></section></div></div><div class="panel view browser-view" id="browser"><div class="chrome"><button>‹</button><button>›</button><button>↻</button><input value="https://api-docs.deepseek.com/zh-cn/guides/vision/"><button>打开</button></div><div class="browser-page"><div><strong>DeepSeek API Docs</strong>视觉理解文档工作区</div></div></div></section></main><script>document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')});document.querySelectorAll('.tabs .tab')[1].onclick=function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));this.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('browser').classList.add('active')}</script></body>
</html>
